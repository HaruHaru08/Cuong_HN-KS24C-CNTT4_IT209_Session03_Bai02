server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/my-web/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Dùng trang lỗi tùy chỉnh cho mã 404
    error_page 404 /404.html;

    # Chỉ Nginx được phép phục vụ tệp này (nội bộ), chặn truy cập trực tiếp từ URL
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }
}
